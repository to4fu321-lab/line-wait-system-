name: Feedback Auto-Triage & Fix

# 現場フィードバックから自動作成された Issue は、投稿時点で Next.js 側の
# AI（/api/feedback）が優先度・分類・対応方針をすでに Issue 本文に記載済み。
# このワークフローは「スーパー管理画面で運用者が承認した Issue」
# （ラベル: approved-for-autofix）だけを対象に実装・PR作成を行う。
# 承認なしに自動修正が走ることはない。
#
# 必要な準備（リポジトリ側）:
#   1. Settings → Secrets and variables → Actions に ANTHROPIC_API_KEY を登録
#   2. Settings → Actions → General → Workflow permissions で
#      「Allow GitHub Actions to create and approve pull requests」を有効化
on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "手動実行する Issue 番号"
        required: true

concurrency:
  group: feedback-autofix-${{ github.event.issue.number || github.event.inputs.issue_number }}
  cancel-in-progress: false

jobs:
  fix:
    # approved-for-autofix ラベルが付いたときだけ実行（手動実行は常に許可）
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' && github.event.action == 'labeled' &&
        github.event.label.name == 'approved-for-autofix')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Claude implement approved fix
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: "--allowed-tools Bash,Edit,Write,Read,Grep,Glob"
          prompt: |
            あなたはこのリポジトリ（Next.js 14 / Supabase / Tailwind）の保守担当です。
            対象 Issue: #${{ github.event.issue.number || github.event.inputs.issue_number }}
            このIssueは運用者が「自動実装してよい」と承認済みです。

            手順:
            1. `gh issue view ${{ github.event.issue.number || github.event.inputs.issue_number }}` で内容を読む。
               店頭スタッフからの「要望/不具合/質問」フィードバックで、本文に AI による
               「AI優先度」「AI分類」「AIによる分析」が記載されている。それを参考にしつつ、
               自分でもコードを確認して妥当性を判断すること（AIの分析を鵜呑みにしない）。
            2. 対応方針を決める:
               - 【質問】コードに関係しない質問 → Issue にていねいに日本語で回答コメントし、`question` ラベルで完了。PRは作らない。
               - 【軽微で安全な修正】文言・ラベル・色・小さなUI不具合・明確な小バグなど、影響範囲が狭く自明なもの
                 → 新しいブランチ `auto/feedback-${{ github.event.issue.number || github.event.inputs.issue_number }}` を作成し、
                   最小限の変更を実装。可能なら `npm run build` で確認。`Closes #<番号>` を含む PR を作成。
                   既存のコード規約・周辺の書き方に合わせること。
               - 【判断・設計が必要 / 影響が広い / 不明確】承認されていても実装が危険と判断した場合
                 → コードは変更せず、Issue に「なぜ自動実装を見送ったか・対応案・必要な確認事項」を
                   日本語でコメントし、`needs-decision` ラベルを付けて終了。運用者の承認より安全側の判断を優先する。
            3. 厳守事項:
               - DBマイグレーションの本番適用、シークレット・環境変数の変更、破壊的操作、検知回避は行わない。
               - 大規模リファクタや仕様変更を伴うものは自動修正しない（needs-decision へ）。
               - 不確実なときは「直さずトリアージ」を選ぶ。安全側に倒す。
               - 返信・コメントは日本語で簡潔に。
